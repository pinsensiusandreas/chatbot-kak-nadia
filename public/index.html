<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kak Nadia — Belajar Bahasa Inggris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F7F1;
    --ink: #1E3A2F;
    --ink-soft: #5B6B62;
    --coral: #FF6F51;
    --coral-dark: #E85A3D;
    --gold: #FFC94A;
    --card: #FFFFFF;
    --border: #DCE6DC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, #E8EFE6 0%, var(--paper) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
  }

  .phone {
    width: 100%;
    max-width: 480px;
    height: 88vh;
    max-height: 780px;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(30, 58, 47, 0.18), 0 2px 8px rgba(30, 58, 47, 0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  header {
    background: var(--ink);
    color: white;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }

  .header-text p {
    margin: 2px 0 0;
    font-size: 12px;
    color: #A9C4B5;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6BE38A;
    display: inline-block;
  }

  .reset-btn {
    margin-left: auto;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #D9E8DE;
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    padding: 7px 12px;
    border-radius: 20px;
    cursor: pointer;
  }
  .reset-btn:hover { background: rgba(255,255,255,0.18); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, #EDF2EA 28px);
  }

  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.5;
    animation: pop-in 0.25s ease;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  @keyframes pop-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--ink);
    position: relative;
  }

  .msg.bot::before {
    content: "";
    position: absolute;
    top: 10px;
    left: -7px;
    width: 12px;
    height: 12px;
    background: var(--card);
    border-left: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    transform: rotate(45deg);
    clip-path: polygon(0 0, 0% 100%, 100% 100%);
  }

  .msg.user {
    align-self: flex-end;
    background: var(--coral);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg.file-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    background: rgba(255,255,255,0.2);
    padding: 4px 9px;
    border-radius: 10px;
    margin-bottom: 6px;
  }

  .msg.bot .file-tag {
    background: var(--gold);
    color: var(--ink);
    font-weight: 600;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #A9BEAF;
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  #file-preview {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: #FFF4E8;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--ink);
  }

  #file-preview.active { display: flex; }

  #file-preview .remove {
    margin-left: auto;
    cursor: pointer;
    color: var(--coral-dark);
    font-weight: 600;
    font-size: 13px;
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: var(--card);
    flex-shrink: 0;
  }

  #attach-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--paper);
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
  }
  #attach-btn:hover { background: #E8EFE6; }

  #text-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    resize: none;
    max-height: 90px;
    outline: none;
  }
  #text-input:focus { border-color: var(--coral); }

  #send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--coral);
    color: white;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #send-btn:hover { background: var(--coral-dark); }
  #send-btn:disabled { background: #C9C9C9; cursor: not-allowed; }

  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-thumb { background: #C7D6CB; border-radius: 10px; }
</style>
</head>
<body>

<div class="phone">
  <header>
    <div class="avatar">N</div>
    <div class="header-text">
      <h1>Kak Nadia</h1>
      <p><span class="dot"></span> Online • Siap bantu belajar</p>
    </div>
    <button class="reset-btn" id="reset-btn">Reset chat</button>
  </header>

  <div id="messages">
    <div class="msg bot">Hai! Aku Kak Nadia 👋 Yuk cerita, mau belajar bahasa Inggris apa hari ini? Kamu juga bisa kirim foto soal, PDF materi, atau rekaman suara buat aku bantu jelasin.</div>
  </div>

  <div id="file-preview">
    <span id="file-name"></span>
    <span class="remove" id="remove-file">Hapus</span>
  </div>

  <div class="composer">
    <button id="attach-btn" title="Lampirkan file">📎</button>
    <input type="file" id="file-input" hidden accept="image/*,application/pdf,audio/*,video/*,.docx">
    <textarea id="text-input" placeholder="Tulis pesan..." rows="1"></textarea>
    <button id="send-btn">➤</button>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:3000/chat';
  const RESET_URL = 'http://localhost:3000/reset';

  let sessionId = localStorage.getItem('kakNadiaSessionId');
  if (!sessionId) {
    sessionId = 'user-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('kakNadiaSessionId', sessionId);
  }

  const messagesEl = document.getElementById('messages');
  const textInput = document.getElementById('text-input');
  const sendBtn = document.getElementById('send-btn');
  const attachBtn = document.getElementById('attach-btn');
  const fileInput = document.getElementById('file-input');
  const filePreview = document.getElementById('file-preview');
  const fileNameEl = document.getElementById('file-name');
  const removeFileBtn = document.getElementById('remove-file');
  const resetBtn = document.getElementById('reset-btn');

  let selectedFile = null;

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      selectedFile = fileInput.files[0];
      fileNameEl.textContent = '📎 ' + selectedFile.name;
      filePreview.classList.add('active');
    }
  });

  removeFileBtn.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    filePreview.classList.remove('active');
  });

  textInput.addEventListener('input', () => {
    textInput.style.height = 'auto';
    textInput.style.height = Math.min(textInput.scrollHeight, 90) + 'px';
  });

  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function addMessage(text, sender, fileLabel) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    if (fileLabel) {
      const tag = document.createElement('div');
      tag.className = 'file-tag';
      tag.textContent = '📎 ' + fileLabel;
      div.appendChild(tag);
      div.appendChild(document.createElement('br'));
    }
    div.appendChild(document.createTextNode(text || ''));
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = textInput.value.trim();
    if (!text && !selectedFile) return;

    addMessage(text, 'user', selectedFile ? selectedFile.name : null);

    const formData = new FormData();
    formData.append('sessionId', sessionId);
    if (text) formData.append('message', text);
    if (selectedFile) formData.append('file', selectedFile);

    textInput.value = '';
    textInput.style.height = 'auto';
    selectedFile = null;
    fileInput.value = '';
    filePreview.classList.remove('active');
    sendBtn.disabled = true;

    showTyping();

    try {
      const res = await fetch(API_URL, { method: 'POST', body: formData });
      const data = await res.json();
      hideTyping();

      if (!res.ok) {
        addMessage('⚠️ ' + (data.error || 'Terjadi kesalahan.'), 'bot');
      } else {
        addMessage(data.reply, 'bot');
      }
    } catch (err) {
      hideTyping();
      addMessage('⚠️ Tidak bisa terhubung ke server. Pastikan server (npm start) sedang jalan.', 'bot');
    } finally {
      sendBtn.disabled = false;
    }
  }

  resetBtn.addEventListener('click', async () => {
    try {
      await fetch(RESET_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId }),
      });
      messagesEl.innerHTML = '';
      addMessage('Chat direset! Mulai obrolan baru yuk 😊', 'bot');
    } catch (err) {
      addMessage('⚠️ Gagal reset, coba lagi.', 'bot');
    }
  });
</script>

</body>
</html>
